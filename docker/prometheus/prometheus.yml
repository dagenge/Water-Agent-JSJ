# Prometheus 配置文件

global:
  scrape_interval: 15s  # 默认抓取间隔
  evaluation_interval: 15s  # 规则评估间隔
  external_labels:
    cluster: 'water-agent'
    environment: 'production'

# 告警管理器配置（可选）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# 加载告警规则
rule_files:
  - '/etc/prometheus/rules/*.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # PostgreSQL 数据库监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          role: 'database'

  # Agent 应用监控
  - job_name: 'water_agent'
    scrape_interval: 10s  # Agent 指标更频繁抓取
    static_configs:
      - targets: ['host.docker.internal:8000']  # 本地运行的 Agent
        labels:
          service: 'water_agent'
          component: 'backend'
    # Docker 内运行的 Agent（取消注释）
    # static_configs:
    #   - targets: ['agent:8000']
    #     labels:
    #       service: 'water_agent'
    #       component: 'backend'

  # Streamlit 应用监控（如果暴露指标）
  - job_name: 'streamlit'
    static_configs:
      - targets: ['host.docker.internal:8501']
        labels:
          service: 'streamlit'
          component: 'frontend'
